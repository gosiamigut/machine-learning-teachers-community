project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - cait.qmd
    - research-innovation.qmd
    - micro-grant-projects.qmd
    - community-blog.qmd
    - about.qmd
  resources:
    - assets/
    - .nojekyll

website:
  title: "ML Teacher Community"
  description: "Explore community events, CAIT, research and innovation, micro-grant projects, and the community blog."
  search: false
  sidebar:
    style: docked
    background: "#153638"
    foreground: "#ffffff"
    border: false
    pinned: true
    contents:
      - text: "Events"
        href: index.qmd
      - text: "CAIT"
        href: cait.qmd
      - text: "Research & Innovation"
        href: research-innovation.qmd
      - text: "Micro-grant projects"
        href: micro-grant-projects.qmd
      - text: "Community blog"
        href: community-blog.qmd
      - text: "About us"
        href: about.qmd
    footer: "People, ideas, and impact."
  page-footer:
    center: |
      ```{=html}
      <div class="sponsor-footer">
        <div class="sponsor-label">Sponsors</div>
        <div class="sponsor-links">
          <a href="https://www.tudelft.nl/">TU Delft</a>
          <a href="https://www.tudelft.nl/ai">AI Initiative</a>
        </div>
        <div class="footer-community">Machine Learning Teachers Community</div>
      </div>
      ```

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: false
    title-block-banner: false
    anchor-sections: false
    link-external-newwindow: true
    lang: en
    grid:
      sidebar-width: 270px
      body-width: 1060px
      margin-width: 0px
      gutter-width: 2.5rem

editor: visual

