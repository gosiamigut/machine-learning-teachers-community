project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - events.qmd
    - cait.qmd
    - micro-grant-projects.qmd
  resources:
    - assets/
    - .nojekyll

website:
  title: "ML Teacher Community"
  description: "Explore the Machine Learning Teacher Community, events, CAIT, and micro-grant projects."
  search: false
  sidebar:
    style: docked
    background: "#153638"
    foreground: "#ffffff"
    border: false
    pinned: true
    contents:
      - text: "About us"
        href: index.qmd
      - text: "Events"
        href: events.qmd
      - text: "CAIT"
        href: cait.qmd
      - text: "Micro-grant projects"
        href: micro-grant-projects.qmd
    footer: "People, ideas, and impact."
  page-footer:
    left: "ML Teacher Community"
    right: "People, ideas, and impact."

format:
  html:
    theme: [cosmo, theme.scss]
    css: styles.css
    toc: false
    title-block-banner: false
    anchor-sections: false
    link-external-newwindow: true
    lang: en
    grid:
      sidebar-width: 270px
      body-width: 1060px
      margin-width: 0px
      gutter-width: 2.5rem

editor: visual

